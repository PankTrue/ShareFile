name: Build and release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GO_VERSION: '1.26.8'
  NODE_VERSION: '24.21.0'
  DOTNET_VERSION: '10.0.x'

jobs:
  prepare:
    name: Find existing release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source_run_id: ${{ steps.packages.outputs.source_run_id }}
      artifact_ids: ${{ steps.packages.outputs.artifact_ids }}
    steps:
      - name: Reuse a successful build of the release commit
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REQUEST: ${{ github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          if [ "$RELEASE_REQUEST" != true ]; then
            exit 0
          fi
          run_ids=$(gh run list --workflow build.yml --commit "$RELEASE_SHA" --status success --limit 100 \
            --json databaseId,event --jq '.[] | select(.event == "push" or .event == "workflow_dispatch" or .event == "release") | .databaseId')
          for run_id in $run_ids; do
            artifact_ids=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | {id, name}' | jq -sr '
                ["sharefile-router", "ShareFile-macOS", "ShareFile-Windows", "ShareFile-Linux"] as $required |
                [.[] | select(.name as $name | $required | index($name))] |
                if (map(.name) | sort) == ($required | sort)
                then map(.id | tostring) | join(",")
                else empty end')
            if [ -n "$artifact_ids" ]; then
              printf 'source_run_id=%s\nartifact_ids=%s\n' "$run_id" "$artifact_ids" >> "$GITHUB_OUTPUT"
              echo "Reusing packages from successful run $run_id for commit $RELEASE_SHA"
              exit 0
            fi
          done
          echo "No complete, unexpired packages for commit $RELEASE_SHA; building all platforms"

  # When no existing packages were found, all build jobs start in parallel.
  router:
    name: Router ARM64 and Web UI
    needs: prepare
    if: needs.prepare.outputs.source_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build router release
        run: make router-release
      - name: Check backend and Web UI
        run: make check web-check
      - name: Check installer and release package
        run: |
          for script in deploy/entware/*.sh deploy/entware/S90sharefile deploy/entware/service/run; do
            sh -n "$script"
          done
          python3 scripts/test-router-installer.py
          cd backend/bin
          sha256sum -c sharefile-router.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: sharefile-router
          if-no-files-found: error
          path: |
            backend/bin/sharefile-router.tar.gz
            backend/bin/sharefile-router.tar.gz.sha256
            backend/bin/install-sharefile.sh

  macos:
    name: macOS universal (ARM64 and x86_64)
    needs: prepare
    if: needs.prepare.outputs.source_run_id == ''
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            clients/core/go.mod
      - name: Check desktop core
        run: make desktop-check
      - name: Build and sign universal client
        run: make macos-build
      - name: Check native client and real backend transfers
        run: make macos-check desktop-smoke
      - name: Generate package checksum
        working-directory: clients/macos/build
        run: |
          shasum -a 256 ShareFile-macOS-universal.zip > ShareFile-macOS-universal.zip.sha256
          shasum -a 256 -c ShareFile-macOS-universal.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ShareFile-macOS
          if-no-files-found: error
          path: |
            clients/macos/build/ShareFile-macOS-universal.zip
            clients/macos/build/ShareFile-macOS-universal.zip.sha256

  windows:
    name: Windows (x64 and ARM64)
    needs: prepare
    if: needs.prepare.outputs.source_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore locked dependencies and compile
        working-directory: clients/windows
        run: |
          dotnet restore ShareFile.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ShareFile.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Protocol and queue tests on Windows
        working-directory: clients/windows
        run: dotnet test --project tests/ShareFile.Core.Tests/ShareFile.Core.Tests.csproj -c Release --no-restore
      - name: Credential Manager and Explorer handoff tests
        working-directory: clients/windows
        run: dotnet test --project tests/ShareFile.Windows.Tests/ShareFile.Windows.Tests.csproj -c Release --no-restore
      - name: Validate PowerShell script syntax
        run: |
          Get-ChildItem clients/windows -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Package self-contained x64 and ARM64 clients
        run: ./clients/windows/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: ShareFile-Windows
          if-no-files-found: error
          path: |
            clients/windows/build/*.zip
            clients/windows/build/*.sha256

  windows-protocol:
    name: Windows protocol with Linux backend
    needs: prepare
    if: needs.prepare.outputs.source_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Build disposable-test backend
        run: make build
      - name: Protocol, queue and real backend tests
        working-directory: clients/windows
        env:
          SHAREFILE_BACKEND: ${{ github.workspace }}/backend/bin/sharefile
        run: |
          dotnet restore tests/ShareFile.Core.Tests/ShareFile.Core.Tests.csproj --locked-mode
          dotnet test --project tests/ShareFile.Core.Tests/ShareFile.Core.Tests.csproj -c Release --no-restore

  linux:
    name: Linux (x86_64 and ARM64)
    needs: prepare
    if: needs.prepare.outputs.source_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            clients/core/go.mod
      - name: Install native desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-keybinder-3.0 libsecret-tools gnome-keyring xvfb dbus-x11 desktop-file-utils xdotool
      - name: Core race tests, queue, bridge and installer
        run: make linux-check PYTHON=/usr/bin/python3
      - name: Real backend transfers, TCP interruption and restart
        run: make linux-smoke PYTHON=/usr/bin/python3
      - name: GTK window, clipboard, Secret Service and file-manager handoff
        env:
          SHAREFILE_REQUIRE_GTK: '1'
        run: |
          test_state=$(mktemp -d)
          trap 'rm -rf "$test_state"' EXIT
          mkdir -m 700 "$test_state/runtime"
          XDG_RUNTIME_DIR="$test_state/runtime" XDG_DATA_HOME="$test_state/data" XDG_CONFIG_HOME="$test_state/config" XDG_STATE_HOME="$test_state/state" dbus-run-session -- xvfb-run -a sh clients/linux/tests/run-gtk.sh
      - name: Package x86_64 and ARM64 clients
        run: make linux-build PYTHON=/usr/bin/python3
      - name: Check package checksums
        working-directory: clients/linux/build
        run: sha256sum -c ./*.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ShareFile-Linux
          if-no-files-found: error
          path: |
            clients/linux/build/*.tar.gz
            clients/linux/build/*.sha256

  release:
    name: Publish all platform packages
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (github.event_name == 'release' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) &&
      (needs.prepare.outputs.source_run_id != '' ||
       (needs.router.result == 'success' && needs.macos.result == 'success' &&
        needs.windows.result == 'success' && needs.windows-protocol.result == 'success' &&
        needs.linux.result == 'success'))
    needs: [prepare, router, macos, windows, windows-protocol, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.source_run_id == ''
        with:
          path: release
          merge-multiple: true
      - name: Download existing release packages
        if: needs.prepare.outputs.source_run_id != ''
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          artifact-ids: ${{ needs.prepare.outputs.artifact_ids }}
          path: release
          merge-multiple: true
      - name: Check downloaded package checksums
        working-directory: release
        run: sha256sum -c ./*.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            case "$RELEASE_TAG" in
              *-*) gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "ShareFile $RELEASE_TAG" --prerelease ;;
              *) gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "ShareFile $RELEASE_TAG" --latest ;;
            esac
          fi
