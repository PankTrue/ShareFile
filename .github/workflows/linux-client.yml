name: Linux client

on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths: ['clients/linux/**', 'clients/core/**', 'backend/**', 'docs/linux.md', 'Makefile', '.github/workflows/linux-client.yml']
  pull_request:
    paths: ['clients/linux/**', 'clients/core/**', 'backend/**', 'docs/linux.md', 'Makefile', '.github/workflows/linux-client.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache-dependency-path: backend/go.sum
      - name: Install native desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 libsecret-tools gnome-keyring xvfb dbus-x11 desktop-file-utils
      - name: Core race tests, queue, bridge and installer
        run: make linux-check PYTHON=/usr/bin/python3
      - name: Real backend transfers, TCP interruption and restart
        run: make linux-smoke PYTHON=/usr/bin/python3
      - name: GTK window, clipboard, Secret Service and file-manager handoff
        env:
          SHAREFILE_REQUIRE_GTK: '1'
        run: |
          test_state=$(mktemp -d)
          mkdir -m 700 "$test_state/runtime"
          XDG_RUNTIME_DIR="$test_state/runtime" XDG_DATA_HOME="$test_state/data" XDG_CONFIG_HOME="$test_state/config" XDG_STATE_HOME="$test_state/state" dbus-run-session -- xvfb-run -a sh clients/linux/tests/run-gtk.sh
      - name: Package x86_64 and ARM64 clients
        run: make linux-build PYTHON=/usr/bin/python3
      - uses: actions/upload-artifact@v7
        with:
          name: ShareFile-Linux
          if-no-files-found: error
          path: |
            clients/linux/build/*.tar.gz
            clients/linux/build/*.sha256
